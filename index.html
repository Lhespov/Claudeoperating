<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      position: fixed;
      overflow: hidden;
    }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #topbar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
    }
    #score {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      color: #4ecca3;
    }
    #pauseBtn {
      background: rgba(78, 204, 163, 0.12);
      color: #4ecca3;
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #pauseBtn:active { transform: scale(0.92); }
    canvas {
      border-radius: 16px;
      display: block;
      box-shadow: 0 0 40px rgba(78, 204, 163, 0.2);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
      padding: 20px;
      text-align: center;
    }
    #overlay .emoji { font-size: 64px; }
    #overlay h2 { font-size: 20px; color: #aaa; font-weight: 400; }
    #overlay .final-score { font-size: 36px; font-weight: 700; color: #4ecca3; }
    #overlay .label { font-size: 14px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
    .btn {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 1px;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.96); }
    .btn.ghost {
      background: transparent;
      color: #4ecca3;
      box-shadow: inset 0 0 0 2px rgba(78, 204, 163, 0.5);
      padding: 12px 36px;
      font-size: 15px;
      margin-top: 4px;
    }
    .hint { font-size: 13px; color: #555; margin-top: 4px; }
    .maps {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 320px;
      margin-top: 6px;
    }
    .map-chip {
      background: rgba(255, 255, 255, 0.04);
      color: #aaa;
      border: 2px solid transparent;
      border-radius: 14px;
      padding: 10px 8px;
      width: 92px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: border-color .15s, color .15s, background .15s;
    }
    .map-chip .map-emoji { font-size: 26px; display: block; margin-bottom: 4px; }
    .map-chip .map-name { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
    .map-chip.selected {
      border-color: #4ecca3;
      color: #4ecca3;
      background: rgba(78, 204, 163, 0.1);
    }
    .map-chip:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="topbar">
    <div id="score">SCORE: 0</div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
  </div>
  <canvas id="game"></canvas>

  <div id="overlay"></div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const pauseBtn = document.getElementById('pauseBtn');

    const CELL = 20;
    let cols, rows, score, snake, dir, nextDir, food, gameLoop, running, paused;
    let walls = new Set();      // obstacle cells, keyed "x,y"
    let selectedMap = 0;

    // ── Maps ─────────────────────────────────────────────────────────────
    // Each map's build(cols, rows) returns an array of {x, y} obstacle cells.
    // Outer edges always wrap (Nokia style); only these inner walls are deadly.
    const MAPS = [
      { name: 'Classic', emoji: '🟢', build: () => [] },
      {
        name: 'Pillars', emoji: '🔵',
        build: (c, r) => {
          const cells = [];
          for (let x = 3; x < c - 1; x += 4)
            for (let y = 3; y < r - 1; y += 4) cells.push({ x, y });
          return cells;
        }
      },
      {
        name: 'Tunnel', emoji: '🚇',
        build: (c, r) => {
          const cells = [];
          const gap = Math.max(2, Math.floor(r / 5));
          const top = Math.floor(r / 2) - gap, bot = Math.floor(r / 2) + gap;
          [Math.floor(c / 4), Math.floor((3 * c) / 4)].forEach(x => {
            for (let y = 0; y < r; y++) if (y < top || y > bot) cells.push({ x, y });
          });
          return cells;
        }
      },
      {
        name: 'Corners', emoji: '📐',
        build: (c, r) => {
          const cells = [];
          const len = Math.max(2, Math.floor(Math.min(c, r) / 4));
          const m = 2; // margin from edge
          const corners = [[m, m, 1, 1], [c - 1 - m, m, -1, 1], [m, r - 1 - m, 1, -1], [c - 1 - m, r - 1 - m, -1, -1]];
          corners.forEach(([sx, sy, dx, dy]) => {
            for (let i = 0; i < len; i++) { cells.push({ x: sx + i * dx, y: sy }); cells.push({ x: sx, y: sy + i * dy }); }
          });
          return cells;
        }
      },
      {
        name: 'Maze', emoji: '🧩',
        build: (c, r) => {
          const cells = [];
          const len = Math.max(3, Math.floor(c / 3));
          const x0 = Math.floor((c - len) / 2);
          [Math.floor(r / 4), Math.floor((3 * r) / 4)].forEach(y => {
            for (let i = 0; i < len; i++) cells.push({ x: x0 + i, y });
          });
          const vlen = Math.max(2, Math.floor(r / 5));
          for (let i = 0; i < vlen; i++) {
            cells.push({ x: Math.floor(c / 4), y: Math.floor(r / 2) - Math.floor(vlen / 2) + i });
            cells.push({ x: Math.floor((3 * c) / 4), y: Math.floor(r / 2) - Math.floor(vlen / 2) + i });
          }
          return cells;
        }
      }
    ];

    function resize() {
      const maxW = window.innerWidth - 32;
      const maxH = window.innerHeight - 110;
      const size = Math.max(Math.min(maxW, maxH), CELL);
      const grid = Math.floor(size / CELL) * CELL;
      canvas.width = grid;
      canvas.height = grid;
      cols = canvas.width / CELL;
      rows = canvas.height / CELL;
    }

    function buildWalls() {
      walls = new Set();
      const cy = Math.floor(rows / 2);
      const cx = Math.floor(cols / 2);
      MAPS[selectedMap].build(cols, rows).forEach(w => {
        if (w.x < 0 || w.x >= cols || w.y < 0 || w.y >= rows) return;
        // Keep the snake's starting corridor (center row) clear so it can spawn safely.
        if (w.y === cy && w.x >= cx - 4 && w.x <= cx + 1) return;
        walls.add(w.x + ',' + w.y);
      });
    }

    function startGame() {
      overlay.style.display = 'none';
      pauseBtn.style.display = 'flex';
      pauseBtn.textContent = '⏸';
      running = true;
      paused = false;
      score = 0;
      scoreEl.textContent = 'SCORE: 0';
      resize();
      buildWalls();
      const cx = Math.floor(cols / 2);
      const cy = Math.floor(rows / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, 130);
      draw();
    }

    function spawnFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y) || walls.has(pos.x + ',' + pos.y));
      food = pos;
    }

    function tick() {
      if (paused) return;
      dir = { ...nextDir };
      // Nokia-style wrap: walk off one edge, reappear on the opposite side.
      const head = {
        x: (snake[0].x + dir.x + cols) % cols,
        y: (snake[0].y + dir.y + rows) % rows
      };

      if (walls.has(head.x + ',' + head.y)) return gameOver();
      if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'SCORE: ' + score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      if (!food || !snake) return;

      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
      }

      // Obstacles
      ctx.fillStyle = '#533483';
      walls.forEach(key => {
        const [x, y] = key.split(',').map(Number);
        roundRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4, 4);
      });

      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      snake.forEach((seg, i) => {
        const ratio = i / snake.length;
        if (i === 0) {
          ctx.fillStyle = '#4ecca3';
          ctx.shadowColor = '#4ecca3';
          ctx.shadowBlur = 8;
        } else {
          ctx.fillStyle = `hsl(162, 60%, ${45 - ratio * 20}%)`;
          ctx.shadowBlur = 0;
        }
        const pad = i === 0 ? 1 : 2;
        roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, i === 0 ? 5 : 4);
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    // ── Overlay screens ──────────────────────────────────────────────────
    function showMenu() {
      running = false;
      paused = false;
      clearInterval(gameLoop);
      pauseBtn.style.display = 'none';
      overlay.style.display = 'flex';
      const chips = MAPS.map((m, i) =>
        `<div class="map-chip${i === selectedMap ? ' selected' : ''}" data-map="${i}">
           <span class="map-emoji">${m.emoji}</span>
           <span class="map-name">${m.name}</span>
         </div>`).join('');
      overlay.innerHTML = `
        <div class="emoji">🐍</div>
        <h2>Choose a map</h2>
        <div class="maps">${chips}</div>
        <button class="btn" id="startBtn">START GAME</button>
        <p class="hint">Swipe or use arrow keys • walls wrap around</p>
      `;
      overlay.querySelectorAll('.map-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          selectedMap = Number(chip.dataset.map);
          overlay.querySelectorAll('.map-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
        });
      });
      document.getElementById('startBtn').addEventListener('click', startGame);
    }

    function togglePause() {
      if (!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶' : '⏸';
      if (paused) {
        overlay.style.display = 'flex';
        overlay.innerHTML = `
          <div class="emoji">⏸️</div>
          <div class="label">Paused</div>
          <div class="final-score">${score}</div>
          <div class="label">Score</div>
          <button class="btn" id="resumeBtn">RESUME</button>
          <button class="btn ghost" id="menuBtn">MAIN MENU</button>
        `;
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('menuBtn').addEventListener('click', showMenu);
      } else {
        overlay.style.display = 'none';
        draw();
      }
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      paused = false;
      pauseBtn.style.display = 'none';
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div class="emoji">💀</div>
        <div class="label">Game Over</div>
        <div class="final-score">${score}</div>
        <div class="label">Score</div>
        <button class="btn" id="againBtn">PLAY AGAIN</button>
        <button class="btn ghost" id="menuBtn">MAIN MENU</button>
      `;
      document.getElementById('againBtn').addEventListener('click', startGame);
      document.getElementById('menuBtn').addEventListener('click', showMenu);
    }

    pauseBtn.addEventListener('click', togglePause);

    // Swipe detection — don't interfere with button taps
    let touchStart = null;
    const MIN_SWIPE = 20;

    document.addEventListener('touchstart', e => {
      if (e.target.closest('button') || e.target.closest('.map-chip')) return;
      e.preventDefault();
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (!touchStart || !running || paused) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);
      touchStart = null;

      if (Math.max(absDx, absDy) < MIN_SWIPE) return;

      if (absDx > absDy) {
        if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
        else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
      } else {
        if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
        else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
      }
    }, { passive: true });

    document.addEventListener('keydown', e => {
      if (e.key === ' ' || e.key.toLowerCase() === 'p') { e.preventDefault(); togglePause(); return; }
      if (!running || paused) return;
      const map = { ArrowRight: {x:1,y:0}, ArrowLeft: {x:-1,y:0}, ArrowDown: {x:0,y:1}, ArrowUp: {x:0,y:-1} };
      const d = map[e.key];
      if (d && (d.x !== -dir.x || d.y !== -dir.y)) nextDir = d;
    });

    window.addEventListener('resize', () => { resize(); if (running && !paused) draw(); });

    resize();
    showMenu();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
