<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Snake">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Snake</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #score {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 14px;
      color: #4ecca3;
    }
    canvas {
      border-radius: 16px;
      display: block;
      box-shadow: 0 0 40px rgba(78, 204, 163, 0.2);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(26, 26, 46, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }
    #overlay .emoji { font-size: 64px; }
    #overlay h2 { font-size: 20px; color: #aaa; font-weight: 400; }
    #overlay .final-score { font-size: 36px; font-weight: 700; color: #4ecca3; }
    #overlay .label { font-size: 14px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
    #startBtn {
      background: #4ecca3;
      color: #1a1a2e;
      border: none;
      padding: 16px 48px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 12px;
      letter-spacing: 1px;
      -webkit-tap-highlight-color: transparent;
    }
    #startBtn:active { transform: scale(0.96); }
    .hint { font-size: 13px; color: #555; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="score">SCORE: 0</div>
  <canvas id="game"></canvas>

  <div id="overlay">
    <div class="emoji">🐍</div>
    <h2>Swipe to move</h2>
    <button id="startBtn">START GAME</button>
    <p class="hint">Add to Home Screen for full-screen mode</p>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');

    const CELL = 20;
    let cols, rows, score, snake, dir, nextDir, food, gameLoop, running;

    function resize() {
      const maxW = window.innerWidth - 32;
      const maxH = window.innerHeight - 100;
      const size = Math.min(maxW, maxH);
      const grid = Math.floor(size / CELL) * CELL;
      canvas.width = grid;
      canvas.height = grid;
      cols = canvas.width / CELL;
      rows = canvas.height / CELL;
    }

    function startGame() {
      overlay.style.display = 'none';
      running = true;
      score = 0;
      scoreEl.textContent = 'SCORE: 0';
      const cx = Math.floor(cols / 2);
      const cy = Math.floor(rows / 2);
      snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      spawnFood();
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, 130);
      draw();
    }

    function spawnFood() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      food = pos;
    }

    function tick() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
        return gameOver();
      }
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        scoreEl.textContent = 'SCORE: ' + score;
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw subtle grid
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= cols; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y <= rows; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(canvas.width, y * CELL);
        ctx.stroke();
      }

      // Food - pulsing red circle
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = '#ff6b6b';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Snake segments
      snake.forEach((seg, i) => {
        const ratio = i / snake.length;
        if (i === 0) {
          ctx.fillStyle = '#4ecca3';
          ctx.shadowColor = '#4ecca3';
          ctx.shadowBlur = 8;
        } else {
          const lightness = 45 - ratio * 20;
          ctx.fillStyle = `hsl(162, 60%, ${lightness}%)`;
          ctx.shadowBlur = 0;
        }
        const pad = i === 0 ? 1 : 2;
        const r = i === 0 ? 5 : 4;
        roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, r);
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
      ctx.fill();
    }

    function gameOver() {
      clearInterval(gameLoop);
      running = false;
      overlay.style.display = 'flex';
      overlay.innerHTML = `
        <div class="emoji">💀</div>
        <div class="label">Game Over</div>
        <div class="final-score">${score}</div>
        <div class="label">Score</div>
        <button id="startBtn" onclick="startGame()">PLAY AGAIN</button>
      `;
    }

    // Swipe detection
    let touchStart = null;
    const MIN_SWIPE = 20;

    document.addEventListener('touchstart', e => {
      e.preventDefault();
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }, { passive: false });

    document.addEventListener('touchend', e => {
      if (!touchStart || !running) return;
      const dx = e.changedTouches[0].clientX - touchStart.x;
      const dy = e.changedTouches[0].clientY - touchStart.y;
      const absDx = Math.abs(dx);
      const absDy = Math.abs(dy);

      if (Math.max(absDx, absDy) < MIN_SWIPE) return;

      if (absDx > absDy) {
        if (dx > 0 && dir.x !== -1) nextDir = { x: 1, y: 0 };
        else if (dx < 0 && dir.x !== 1) nextDir = { x: -1, y: 0 };
      } else {
        if (dy > 0 && dir.y !== -1) nextDir = { x: 0, y: 1 };
        else if (dy < 0 && dir.y !== 1) nextDir = { x: 0, y: -1 };
      }
      touchStart = null;
    }, { passive: true });

    // Keyboard support (for testing on desktop)
    document.addEventListener('keydown', e => {
      if (!running) return;
      const map = {
        ArrowRight: { x: 1, y: 0 },
        ArrowLeft: { x: -1, y: 0 },
        ArrowDown: { x: 0, y: 1 },
        ArrowUp: { x: 0, y: -1 },
      };
      const d = map[e.key];
      if (!d) return;
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    });

    document.getElementById('startBtn').addEventListener('click', startGame);

    window.addEventListener('resize', () => {
      resize();
      if (!running) draw();
    });

    resize();
    draw();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
